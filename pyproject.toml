[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nflcast"
version = "0.1.0"
description = "Reproducible NFL game forecasting portfolio (expected scores, margins, totals, outcome probabilities)."
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.30",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pyyaml>=6",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nflcast = "nflcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
